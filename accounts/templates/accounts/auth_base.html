<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Retail IQ{% endblock %} — Retail Intelligence</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--body-bg);
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }
        .auth-card-header {
            background: var(--sidebar-bg);
            color: #fff;
            text-align: center;
            padding: 28px 24px;
        }
        .auth-card-header i { font-size: 28px; color: var(--primary); }
        .auth-card-header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-top: 8px;
        }
        .auth-card-body { padding: 28px 24px; }
        .auth-card-body h2 {
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
            color: var(--text-primary);
        }
        .auth-field { margin-bottom: 16px; }
        .auth-field label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .auth-field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: var(--transition);
        }
        .auth-field input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        .auth-submit {
            width: 100%;
            padding: 11px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }
        .auth-submit:hover { background: var(--primary-dark); }
        .auth-errors {
            background: #FEF2F2;
            border: 1px solid var(--danger);
            color: var(--danger);
            border-radius: var(--radius-sm);
            padding: 10px 12px;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
<div class="auth-page">
    {% block content %}{% endblock %}
</div>
</body>
</html>

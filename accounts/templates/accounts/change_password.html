{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Change Password{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-left">
        <h1>Change Password</h1>
    </div>
</div>

<div class="card" style="max-width:440px; padding:24px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Current Password</label>
            {{ form.old_password }}
        </div>
        <div class="form-group">
            <label>New Password</label>
            {{ form.new_password1 }}
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            {{ form.new_password2 }}
        </div>
        <button type="submit" class="btn-primary-modern" style="width:100%; padding:10px;">Change Password</button>
    </form>
    <a href="{% url 'staff_profile' %}" style="display:block; text-align:center; margin-top:16px; font-size:13px; color:var(--text-muted);">← Back to My Profile</a>
</div>
{% endblock %}

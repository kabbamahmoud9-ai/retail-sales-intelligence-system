{% extends 'ecommerce/base_store.html' %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div style="max-width:440px; margin:0 auto;">
    <h2 style="font-size:1.4rem; font-weight:700; margin-bottom:1.5rem;">Change Password</h2>
    <div class="checkout-card">
        <div class="checkout-card-body">
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" name="current_password" required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" required minlength="6">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" name="confirm_password" required minlength="6">
                </div>
                <button type="submit" class="btn-primary-modern" style="width:100%; padding:0.7rem;">Change Password</button>
            </form>
            <a href="{% url 'ecommerce:profile' %}" style="display:block; text-align:center; margin-top:1rem; font-size:0.85rem; color:var(--text-muted);">← Back to My Account</a>
        </div>
    </div>
</div>
{% endblock %}

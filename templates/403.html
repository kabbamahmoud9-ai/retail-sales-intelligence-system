{% extends 'base.html' %}
{% block title %}Access Denied{% endblock %}
{% block page_title %}Access Denied{% endblock %}
{% block content %}
<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center;">
    <i class="bi bi-shield-lock" style="font-size:48px; color: var(--danger); margin-bottom:16px;"></i>
    <h2 style="font-size:20px; font-weight:600; margin-bottom:8px;">Access Denied</h2>
    <p style="color: var(--text-secondary); max-width:420px;">
        {{ exception|default:"You don't have permission to view this page." }}
    </p>
    <a href="{% url 'dashboard' %}" class="btn-primary-modern" style="margin-top:20px; display:inline-block; text-decoration:none;">
        Back to Dashboard
    </a>
</div>
{% endblock %}
